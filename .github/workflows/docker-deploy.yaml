name: Docker Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name acrproj2dr

      - name: Build and Push App Tier Image
        if: contains(github.event.head_commit.modified, 'app/') || contains(github.event.head_commit.added, 'app/')
        working-directory: app
        run: |
          docker build --platform linux/amd64 -t acrproj2dr.azurecr.io/app-proj2dr-app:latest .
          docker push acrproj2dr.azurecr.io/app-proj2dr-app:latest

      - name: Build and Push Web Tier Image
        if: contains(github.event.head_commit.modified, 'web/') || contains(github.event.head_commit.added, 'web/')
        working-directory: web
        run: |
          docker build --platform linux/amd64 -t acrproj2dr.azurecr.io/app-proj2dr-web:latest .
          docker push acrproj2dr.azurecr.io/app-proj2dr-web:latest

      - name: Restart App Tier
        if: contains(github.event.head_commit.modified, 'app/') || contains(github.event.head_commit.added, 'app/')
        run: az webapp restart --name app-proj2dr-app --resource-group rg-project2-dr

      - name: Restart Web Tier
        if: contains(github.event.head_commit.modified, 'web/') || contains(github.event.head_commit.added, 'web/')
        run: az webapp restart --name app-proj2dr-web --resource-group rg-project2-dr